name: Bug report
description: Report a defect in the backend
title: "fix: <short description>"
labels: ["bug"]
type: Bug
projects: ["Kntro-Soft/3"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: dropdown
    id: context
    attributes:
      label: Bounded context / area
      options:
        - iam
        - billing
        - workspace
        - discovery
        - gateway
        - shared
        - build / ci
        - unknown
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Call endpoint ...
        2. With payload ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual behavior
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How we verify the fix. Work on it in `bugfix/<issue-number>-<slug>` and close it with `Closes #<issue-number>`.
      value: |
        Scenario: <name>
          Given <context that triggered the bug>
          When <action>
          Then <expected behavior>
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        - Profile: dev/prod/test
        - Commit / branch:
        - JDK: 25
        - OS:
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs / stacktrace
      render: shell
    validations:
      required: false
