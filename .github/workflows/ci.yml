name: CI

on:
  pull_request:
  push:
    branches: [ develop, main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1) Fast lane — pure unit/slice tests, no Docker, no app-context boot. Fails in seconds and
  #    short-circuits the expensive stages below.
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - run: chmod +x ./gradlew
      - name: Run unit tests
        run: ./gradlew unitTest jacocoTestReport --no-daemon
      - name: Upload coverage (unit)
        uses: codecov/codecov-action@v7
        with:
          files: build/reports/jacoco/test/jacocoTestReport.xml
          flags: unit
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports
          path: build/reports/tests/
          retention-days: 7

  # 2) Integration — Testcontainers-backed (Docker is available on ubuntu-latest runners).
  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - run: chmod +x ./gradlew
      - name: Run integration tests
        run: ./gradlew integrationTest jacocoTestReport --no-daemon
      - name: Upload coverage (integration)
        uses: codecov/codecov-action@v7
        with:
          files: build/reports/jacoco/test/jacocoTestReport.xml
          flags: integration
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload integration test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-reports
          path: build/reports/tests/
          retention-days: 7

  # 3) Verify — architecture rules + module boundaries and assemble the deployable jar.
  verify:
    name: Architecture & build
    runs-on: ubuntu-latest
    needs: integration
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - run: chmod +x ./gradlew
      - name: Architecture, module boundaries and assemble
        run: ./gradlew architectureTest verifyModularity assemble --no-daemon
      - name: Upload verify reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verify-reports
          path: |
            build/reports/tests/
            build/spring-modulith-docs/
          retention-days: 7
