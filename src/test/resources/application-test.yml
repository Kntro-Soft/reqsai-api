spring:
  datasource:
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
  jpa:
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration/common

reqsai:
  jwt:
    public-key-path: classpath:certs/public_key.pem
    issuer: reqsai-test
  cors:
    allowed-origins: http://localhost:4200
    allow-credentials: true

logging:
  level:
    com.kntro.reqsai: DEBUG

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
