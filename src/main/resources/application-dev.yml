spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/reqsai}
    username: ${DB_USERNAME:reqsai}
    password: ${DB_PASSWORD:secret}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
      validation-timeout: 3000
      leak-detection-threshold: 30000
  jpa:
    show-sql: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY:dev-placeholder-not-a-real-key}
    vectorstore:
      pgvector:
        initialize-schema: true

reqsai:
  integrations:
    # Local-only default AES-256 key (base64 of bytes 0..31) so the app boots without a .env in dev.
    # Override with a real INTEGRATIONS_ENCRYPTION_KEY anywhere it matters. NEVER use this in prod.
    encryption-key: ${INTEGRATIONS_ENCRYPTION_KEY:AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=}
    jira:
      oauth:
        # Dummy dev defaults so the OAuth beans wire and the authorize-url endpoint is exercisable
        # locally. These are NOT real Atlassian credentials; register a real app and override via .env.
        client-id: ${JIRA_OAUTH_CLIENT_ID:dev-client-id}
        client-secret: ${JIRA_OAUTH_CLIENT_SECRET:dev-client-secret}
        redirect-uri: ${JIRA_OAUTH_CALLBACK_URL:http://localhost:4200/integrations/jira/callback}
        state-secret: ${JIRA_OAUTH_STATE_SECRET:AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=}

logging:
  level:
    com.kntro.reqsai: DEBUG
    org.springframework.modulith: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.hibernate.orm.connections.pooling: WARN
  pattern:
    console: "%d{HH:mm:ss} %-5level [%X{tenantId}][%X{correlationId}] %logger{30} - %msg%n"
