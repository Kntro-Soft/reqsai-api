spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/reqsai}
    username: ${DB_USERNAME:reqsai}
    password: ${DB_PASSWORD:secret}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
      validation-timeout: 3000
  jpa:
    show-sql: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY:dev-placeholder-not-a-real-key}
    vectorstore:
      pgvector:
        initialize-schema: true

logging:
  level:
    com.kntro.reqsai: DEBUG
    org.springframework.modulith: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
  pattern:
    console: "%d{HH:mm:ss} %-5level [%X{tenantId}][%X{correlationId}] %logger{30} - %msg%n"
