spring:
  application:
    name: backend-reqsai
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    import: optional:file:.env[.properties]
  autoconfigure:
    exclude:
      - org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration

  threads:
    virtual:
      enabled: true

  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_FILE_SIZE:50MB}
      max-request-size: ${MAX_UPLOAD_REQUEST_SIZE:55MB}

  docker:
    compose:
      profiles:
        active: core

  datasource:
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        multi_tenancy: SCHEMA
        format_sql: true
        jdbc:
          time_zone: UTC
          batch_size: 20
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration/common
    schemas: public
    baseline-on-migrate: true
    validate-on-migrate: true
    out-of-order: true

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  ai:
    model:
      chat: ${SPRING_AI_MODEL_CHAT:none}
      embedding: ${SPRING_AI_MODEL_EMBEDDING:none}
      image: none
      moderation: none
      audio:
        transcription: ${SPRING_AI_MODEL_AUDIO_TRANSCRIPTION:none}
        speech: none
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      init:
        pull-model-strategy: never
      chat:
        model: ${OLLAMA_CHAT_MODEL:llama3.1:8b}
      embedding:
        options:
          model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
    google:
      genai:
        api-key: ${GEMINI_API_KEY:}
        chat:
          model: ${GEMINI_CHAT_MODEL:gemini-2.0-flash}
        embedding:
          text:
            options:
              model: ${GEMINI_EMBEDDING_MODEL:text-embedding-004}
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        model: ${OPENAI_CHAT_MODEL:gpt-4o-mini}
      embedding:
        model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
        dimensions: 768
      audio:
        transcription:
          base-url: ${WHISPER_BASE_URL:http://localhost:9000/v1}
          api-key: ${WHISPER_API_KEY:not-needed}
          model: ${WHISPER_MODEL:small}
    vectorstore:
      pgvector:
        initialize-schema: false
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 768

reqsai:
  name: ${APP_NAME:Reqs-AI}
  url: ${APP_URL:http://localhost:8080}
  frontend-url: ${FRONTEND_URL:http://localhost:4200}
  email:
    provider: ${EMAIL_PROVIDER:mailpit}
    from: ${MAIL_FROM:noreply@reqsai.com}
  ai:
    stt:
      batch:
        provider: ${STT_PROVIDER:whisper}
      streaming:
        provider: ${STT_STREAMING_PROVIDER:whisperlive}
    generation:
      provider: ${GENERATION_PROVIDER:gemini}
    embedding:
      provider: ${EMBEDDING_PROVIDER:auto}
  iam:
    token:
      token-bytes: ${IAM_TOKEN_BYTES:32}
      password-reset-expiration: ${IAM_PASSWORD_RESET_EXPIRATION:1h}
      email-verification-expiration: ${IAM_EMAIL_VERIFICATION_EXPIRATION:24h}
  invitation:
    expiry: ${INVITATION_EXPIRY:7d}
  billing:
    # Active payment gateway: 'fake' (default, no real charges) or 'stripe'.
    payment-provider: ${BILLING_PAYMENT_PROVIDER:fake}
    # ISO-4217 display currency.
    currency: ${BILLING_CURRENCY:USD}
    # Per-plan DISPLAY pricing (minor units / cents) + the Stripe Price id actually charged.
    # Defined prices: PRO USD 29.00/mo, ENTERPRISE USD 99.00/mo (FREE is $0, provisioned on signup).
    # NOTE: amount-cents is display only; the CHARGED amount is the Stripe Price object, so the
    # recurring Price you create in Stripe MUST match these amounts (keep the web plan catalog in sync).
    plans:
      pro:
        amount-cents: ${BILLING_PRO_AMOUNT_CENTS:4900}
        stripe-price-id: ${BILLING_PRO_STRIPE_PRICE_ID:}
      enterprise:
        amount-cents: ${BILLING_ENTERPRISE_AMOUNT_CENTS:14900}
        stripe-price-id: ${BILLING_ENTERPRISE_STRIPE_PRICE_ID:}
    # Stripe credentials + hosted-checkout return URLs (required only when payment-provider=stripe).
    # Return URLs point at the WEB app (Angular, :4200), NOT the API — that is where the
    # /billing/success and /billing/cancel landing routes live.
    stripe:
      api-key: ${STRIPE_API_KEY:}
      webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
      success-url: ${STRIPE_SUCCESS_URL:${WEB_APP_URL:http://localhost:4200}/billing/success}
      cancel-url: ${STRIPE_CANCEL_URL:${WEB_APP_URL:http://localhost:4200}/billing/cancel}
  integrations:
    # Base64-encoded 32-byte (AES-256) key used to encrypt third-party integration secrets at rest
    # (ADR-0023). Required for the integrations feature; keep it out of source control (.env / secret).
    encryption-key: ${INTEGRATIONS_ENCRYPTION_KEY:}
    jira:
      oauth:
        client-id: ${JIRA_OAUTH_CLIENT_ID:}
        client-secret: ${JIRA_OAUTH_CLIENT_SECRET:}
        redirect-uri: ${JIRA_OAUTH_CALLBACK_URL:}
        state-secret: ${JIRA_OAUTH_STATE_SECRET:}
  jwt:
    private-key-path: ${JWT_PRIVATE_KEY_PATH:classpath:certs/private_key.pem}
    private-key-pem: ${JWT_PRIVATE_KEY_PEM:}
    public-key-path: ${JWT_PUBLIC_KEY_PATH:classpath:certs/public_key.pem}
    public-key-pem: ${JWT_PUBLIC_KEY_PEM:}
    issuer: ${JWT_ISSUER:reqsai}
    access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:15m}
    refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:7d}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
    allow-credentials: true
  pagination:
    default-size: ${PAGINATION_DEFAULT_SIZE:20}
    max-size: ${PAGINATION_MAX_SIZE:100}
  websocket:
    endpoint: ${WS_ENDPOINT:/ws/stomp}
    allowed-origins: ${WS_ALLOWED_ORIGINS:${CORS_ALLOWED_ORIGINS:http://localhost:4200}}
    enable-sock-js: ${WS_ENABLE_SOCKJS:false}
    broker:
      mode: ${WS_BROKER_MODE:SIMPLE}
      host: ${WS_BROKER_HOST:localhost}
      port: ${WS_BROKER_PORT:61613}
      login: ${WS_BROKER_LOGIN:guest}
      passcode: ${WS_BROKER_PASSCODE:guest}

discovery:
  realtime:
    min-transcript-chars: ${DISCOVERY_REALTIME_MIN_TRANSCRIPT_CHARS:180}
    max-transcript-age-seconds: ${DISCOVERY_REALTIME_MAX_TRANSCRIPT_AGE_SECONDS:22}
    context-top-k: ${DISCOVERY_REALTIME_CONTEXT_TOP_K:5}
    dedup-similarity-threshold: ${DISCOVERY_REALTIME_DEDUP_SIMILARITY_THRESHOLD:0.84}

server:
  port: ${PORT:${SERVER_PORT:8080}}

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}
    path: /api-docs
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:true}
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,modulith
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState, db
        liveness:
          include: livenessState
  health:
    mail:
      enabled: false
