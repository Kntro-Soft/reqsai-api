# Build performance
# Reuse outputs of up-to-date tasks across builds (skips :test when nothing changed).
org.gradle.caching=true
# Run independent tasks in parallel.
org.gradle.parallel=true
# Keep the Gradle daemon warm between invocations.
org.gradle.daemon=true
# Configuration cache speeds up the configuration phase, but some plugins may not be
# compatible yet — enable once verified green:
# org.gradle.configuration-cache=true
